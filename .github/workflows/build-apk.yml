name: Build APK Android

# Produit un APK installable, telechargeable dans les artefacts de l'execution.
# Lancement manuel depuis l'onglet Actions, ou automatique a chaque push sur main.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL du backend deploye (laisser vide pour utiliser la variable API_URL du depot)"
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Expo remplace les variables EXPO_PUBLIC_* dans le bundle au moment du build,
      # et non a l'execution. Elle doit donc etre presente des la compilation.
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.API_URL }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dependances
        run: npm ci

      - name: Afficher la cible du backend
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::EXPO_PUBLIC_API_URL est vide, l'application utilisera l'URL de repli definie dans src/constants/index.ts"
          else
            echo "Backend cible : $EXPO_PUBLIC_API_URL"
          fi

      - name: Generer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: mutuelle-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
